services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: media_vault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./public/build:/var/www/html/public/build          # Vue updates (fast)
      - ./storage/app/public:/var/www/html/public/storage   # Uploaded covers (fast)
    depends_on:
      - mysql

volumes:
  mysql_data: